name = "fawaz-platform"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"

# Cloudflare D1 Database Binding
# Replace database_id with your Cloudflare D1 Database ID from: npx wrangler d1 create fawaz-db
[[d1_databases]]
binding = "DB"
database_name = "fawaz-db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"
