name = "fawazalharbi"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "api/index.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "fawaz_db"
database_id = "48bdb38c-e07d-4407-a9c2-33b882b1450f"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Production environment variables (set secrets via: wrangler secret put JWT_SECRET, wrangler secret put OPENAI_API_KEY)
[vars]
APP_NAME = "Fawaz Platform"
ADMIN_EMAIL = "me@fawazalharbi.dev"
CONTACT_EMAIL = "me@fawazalharbi.dev"
APP_ENV = "production"
