version: '3.8'

services:
  # 1. MySQL Database Service
  database:
    image: mysql:8.0
    container_name: fawaz_db
    restart: always
    environment:
      MYSQL_DATABASE: fawaz_platform
      MYSQL_USER: fawaz_user
      MYSQL_PASSWORD: Password123!
      MYSQL_ROOT_PASSWORD: RootPassword123!
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Laravel Backend REST API
  api:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: fawaz_api
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: fawaz_platform
      DB_USERNAME: fawaz_user
      DB_PASSWORD: Password123!
    ports:
      - "8000:8000"
    depends_on:
      - database

  # 3. Vue.js Production Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fawaz_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
